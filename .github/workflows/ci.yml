name: "CI"
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: "Get the code"
        uses: actions/checkout@v5
      - name: "Set up node"
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: "Install packages"
        run: npm ci
      - name: "Typecheck, lint, unit tests"
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Get the code"
        uses: actions/checkout@v5
      - name: "Set up node"
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: "Install packages"
        run: npm ci
      - name: "Build"
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
